name: Release

# A tag `vX.Y.Z` (or a manual run with a version) builds the signed Android
# APK and the Windows bundle and publishes them as a GitHub Release. The app
# checks `releases/latest` to offer the update in-app.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Wersja wydania, np. 1.2.0 (tag v1.2.0 zostanie utworzony)'
        required: true

permissions:
  contents: write

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Wersja: $V"

  android:
    needs: meta
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Release signing config
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=$GITHUB_WORKSPACE/android/app/upload-keystore.jks"
          } > android/key.properties

      - name: Build APK
        run: |
          flutter build apk --release \
            --build-name="$VERSION" --build-number="${{ github.run_number }}" \
            --dart-define=APP_VERSION="$VERSION"
          mv build/app/outputs/flutter-apk/app-release.apk "escape_room-$VERSION.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: escape_room-*.apk

  windows:
    needs: meta
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Windows
        shell: pwsh
        run: |
          flutter build windows --release --build-name="$env:VERSION" --dart-define=APP_VERSION="$env:VERSION"
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "escape_room-windows-$env:VERSION.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: escape_room-windows-*.zip

  release:
    needs: [meta, android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.meta.outputs.version }}
          name: Pokój Zagadek AI ${{ needs.meta.outputs.version }}
          generate_release_notes: true
          files: |
            dist/escape_room-*.apk
            dist/escape_room-windows-*.zip
