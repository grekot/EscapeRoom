name: escape_room
description: "Pokój Zagadek AI – escape roomy tworzone i prowadzone przez AI."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^17.5.0
  http: ^1.6.0
  flutter_secure_storage: ^11.0.0
  path_provider: ^2.1.6
  file_picker: ^12.2.0
  uuid: ^4.6.0
  image: ^4.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  assets:
    - assets/scenarios/
    - assets/gamespecs/
    - assets/docs/
    - assets/images/builtin_warsztat_wynalazcy/
    - assets/images/builtin_latarnia/
