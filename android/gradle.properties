android.useAndroidX=true
# AGP 9 compatibility: Flutter plugins (and this app) still apply the standalone
# Kotlin Gradle plugin, so AGP's built-in Kotlin and the new DSL stay off.
android.builtInKotlin=false
android.newDsl=false
# org.gradle.jvmargs celowo nie jest tu ustawione: wartosc (z obejsciem AF_UNIX/TEMP 8.3 dla JDK17)
# pochodzi z ~/.gradle/gradle.properties na maszynie deweloperskiej.
